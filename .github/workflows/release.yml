name: Build and push Docker image

on:
  release:
    types: [published]
  # Manual trigger so we can rebuild any existing tag (e.g. backfill an image
  # for a release whose original workflow run misconfigured tagging).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. 2026.05.01-02)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Third-party actions are pinned to full commit SHAs: a tag like `v4` can
    # be moved to different code by whoever controls the action's repo, and this
    # job holds `packages: write`. The trailing comment is the release the SHA
    # corresponds to; Dependabot (`github-actions` ecosystem) keeps both current.
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # On manual dispatch, check out the requested tag instead of the
          # default branch. On release: published, github.ref already points
          # at the tag, so this is a no-op there.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Use the literal git tag as the image tag — apt-ui uses date-based
          # versions like 2026.05.01-02 which aren't SemVer, so the prior
          # `type=semver` rules silently produced no version-tagged image.
          # On manual workflow_dispatch the input value drives the tag name.
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # Only a real release moves :latest. Rebuilding an older tag by hand
            # must not repoint it, or every `:latest` deployment silently
            # downgrades to a build that may carry since-fixed vulnerabilities.
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.event.inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
